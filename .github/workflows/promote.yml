name: Promote to Production

# Manual gate and the ONLY place a release is cut. Beta ships on every push to
# main; running this workflow makes semantic-release batch every commit since
# the last tag into a single version bump + changelog entry + GitHub release,
# then deploys that build to production (app.spellsplice.com).

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}
      - run: git fetch origin "+refs/notes/*:refs/notes/*" || true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Bumps package.json, appends CHANGELOG.md, tags, and cuts the GitHub
      # release from all commits since the last tag.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      # Build after semantic-release so the working tree carries the bumped
      # package.json, which vite.config.ts reads into __APP_VERSION__. Channel
      # defaults to stable when APP_CHANNEL is unset.
      - run: npm run build

      # --env="" explicitly targets the top-level (production) environment.
      # Bare `deploy` would work but warns, since beta is also defined.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=""
