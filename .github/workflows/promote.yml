name: Promote to Production

# Manual gate. Beta is deployed automatically on every push to main; production
# is only ever published by running this workflow against a released tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (for example v1.3.0)'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # --env="" explicitly targets the top-level (production) environment.
      # Bare `deploy` would work but warns, since beta is also defined.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=""
