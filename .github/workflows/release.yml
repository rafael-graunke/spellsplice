name: Deploy Beta

# Every push to main ships straight to beta. No version bump, no changelog, no
# tag, no GitHub release -- beta is just "latest main". Releases are cut only by
# promote.yml, which runs semantic-release when you promote to stable.

on:
  push:
    branches: [main]

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls tags so vite's `git describe` can stamp the version
      # as <last-tag>-<commits>-g<sha> (e.g. 1.3.0-14-ga1b2c3d).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - run: npm run build
        env:
          APP_CHANNEL: beta

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=beta
