<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spellsplice</title>
        <script>
            // Apply theme before first paint to avoid a light→dark flash.
            // Must match ThemeProvider's storageKey + defaultTheme.
            (function () {
                try {
                    var t =
                        localStorage.getItem('vite-ui-theme') || 'dark';
                    if (t === 'system') {
                        t = window.matchMedia('(prefers-color-scheme: dark)')
                            .matches
                            ? 'dark'
                            : 'light';
                    }
                    document.documentElement.classList.add(t);
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
